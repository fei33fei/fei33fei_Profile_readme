<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>溢出测量</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 13px/1.6 monospace; padding: 10px; }
  #frame { width: 390px; height: 820px; border: 1px solid #555; }
  pre { white-space: pre-wrap; color: #9fe; }
  .bad { color: #ff7676; }
</style>
</head>
<body>
<pre id="out">measuring…</pre>
<iframe id="frame" src="/?__measure=1"></iframe>
<script>
  const W = 390;
  const frame = document.getElementById('frame');
  frame.style.width = W + 'px';
  frame.addEventListener('load', () => {
    setTimeout(() => {
      const d = frame.contentDocument;
      const win = frame.contentWindow;
      const out = [];
      const vw = win.innerWidth;
      out.push('iframe innerWidth = ' + vw + '  clientWidth = ' + d.documentElement.clientWidth + '  scrollWidth = ' + d.documentElement.scrollWidth);
      const sel = ['.shell', '.hero__grid', '.hero__grid > div', '.hero__positioning', '.hero__positioning span', '.hero__cta', '.hero__name', '.hero__meta', '.site-nav__inner'];
      sel.forEach(s => {
        const el = d.querySelector(s);
        if (!el) { out.push('MISSING ' + s); return; }
        const r = el.getBoundingClientRect();
        out.push(s.padEnd(26) + ' left=' + r.left.toFixed(1) + ' w=' + r.width.toFixed(1) + ' right=' + r.right.toFixed(1) + ' scrollW=' + el.scrollWidth);
      });
      out.push('--- elements extending past viewport ---');
      d.querySelectorAll('body *').forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.width > 0 && r.right > vw + 0.5) {
          out.push((el.tagName + '.' + (el.className || '')).slice(0, 60) + '  right=' + r.right.toFixed(1) + ' w=' + r.width.toFixed(1));
        }
      });
      document.getElementById('out').textContent = out.join('\n');
    }, 900);
  });
</script>
</body>
</html>
